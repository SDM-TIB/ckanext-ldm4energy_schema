scheming_version: 2
dataset_type: dataset
about: A reimplementation of the default CKAN dataset schema
about_url: http://github.com/ckan/ckanext-scheming

sections:
  - section_id: spatial_sec
    title: Spatial Information
    subtitle: Extend your resource with spatial information
  - section_id: temporal_sec
    title: Temporal Information
    subtitle: Extend your resource with temporal information
  - section_id: sources_sec
    title: Sources
    subtitle: Extend your resource with information about its sources
  - section_id: licenses_sec
    title: Licenses
    subtitle: Extend your resource with license information
  - section_id: contributors_sec
    title: Contributors
    subtitle: Extend your resource with information about its contributors
  - section_id: schema_sec
    title: Schema
    subtitle: Extend your resource with information about its schema

dataset_fields:

- field_name: title
  label: Title
  preset: title
  form_placeholder: e.g. A descriptive title

- field_name: name
  label: URL
  preset: dataset_slug
  form_placeholder: e.g. my-dataset

- field_name: notes
  label: Description
  form_snippet: markdown.html
  form_placeholder: e.g. Some useful notes about the data

- field_name: tag_string
  label: Tags
  preset: tag_string_autocomplete
  form_placeholder: eg. economy, mental health, government

- field_name: keywords
  label: Keywords
  preset: multiple_text
  form_placeholder: e.g. example, ODbL-1.0, NFDI4Energy

- field_name: license_id
  label: License
  form_snippet: license.html
  display_snippet: license.html
  help_text: License definitions and additional information can be found at http://opendefinition.org/

- field_name: owner_org
  label: Organization
  preset: dataset_organization

- field_name: url
  label: Source
  form_placeholder: http://example.com/dataset.json
  display_property: foaf:homepage
  display_snippet: link.html

- field_name: defined_in
  label: Defined In
  form_placeholder: https://doi.org/10.48550/arXiv.2008.07176
  display_property: datacite:isDescribedBy
  display_snippet: link.html
  validators: ignore_missing unicode_safe doi_to_url

- field_name: citation
  label: Citation
  preset: multiple_text
  display_property: schema:citation

- field_name: link_orkg
  label: Link to ORKG
  display_snippet: link.html

- field_name: author
  label: Author
  required: true
  form_placeholder: Joe Bloggs
  display_property: dc:creator
  form_snippet: author.html
  display_snippet: author.html

- field_name: orcid
  label: ORCID
  form_placeholder: 'ORCID e.g. 0000-0002-1825-0097'
  form_snippet: orcid.html

- field_name: extra_authors
  label: More Authors
  display_snippet: repeating_subfields_authors.html
  repeating_subfields:
    - field_name: extra_author
      label: Author
      required: false
      validators: ignore_missing
      form_snippet: author.html
    - field_name: orcid
      label: ORCID
      form_placeholder: 'ORCID e.g. 0000-0002-1825-0097'
      form_snippet: orcid.html
      validators: ignore_missing

- field_name: author_email
  label: Author Email
  form_placeholder: joe@example.com
  display_property: dc:creator
  display_snippet: email.html
  display_email_name_field: author

- field_name: maintainer
  label: Maintainer
  form_placeholder: Joe Bloggs
  display_property: dc:contributor

- field_name: maintainer_email
  label: Maintainer Email
  form_placeholder: joe@example.com
  display_property: dc:contributor
  display_snippet: email.html
  display_email_name_field: maintainer

- field_name: version_info
  label: Version Information
  repeating_subfields:
  - field_name: version
    label: Version
    required: false
    validators: ignore_missing unicode package_version_validator
    form_placeholder: '1.0'
  - field_name: version_note
    label: Version Note
    validators: ignore_missing unicode package_version_validator
    form_placeholder: 'Initial version.'

- field_name: language
  label: Language
  form_placeholder: 'e.g. English'

- field_name: landing_page
  label: Homepage
  form_placeholder: 'e.g. https://www.google.com/'

- field_name: accrualPeriodicity
  label: Update Frequency
  form_placeholder: 'e.g. monthly'

- field_name: conformsTo
  label: Conforms to Standard
  form_placeholder: 'e.g. Link to Standards model'

- field_name: access_rights
  label: Access Rights
  form_placeholder: 'e.g. Public, Private, etc.'

- field_name: page
  label: Description Page
  form_placeholder: 'e.g. Link to dataset description'

- field_name: spatial
  label: Location
  form_placeholder: 'e.g. location (country, etc.) where the dataset takes place'

- field_name: spatial_resolution
  label: Location Area
  form_placeholder: 'e.g. physical area'

- field_name: temporal_resolution
  label: Period of Time
  form_placeholder: 'e.g. length of time the dataset covers'

- field_name: start_date
  label: Start Date
  form_placeholder: 'e.g. start date of the time period'
  validators: ignore_missing

- field_name: end_date
  label: End Date
  form_placeholder: 'e.g. end date of the time period'
  validators: ignore_missing

- field_name: services_used_list
  label: Related Services
  preset: service_selection_tool
  display_snippet: services_in_dataset.html

- field_name: extras
  label: Custom Fields
  repeating_subfields:
  - field_name: key
    label: Key
    required: false
  - field_name: value
    label: Value

resource_fields:

- field_name: url
  label: URL
  preset: resource_url_upload

- field_name: name
  label: Name
  form_placeholder: eg. January 2011 Gold Prices
  required: true

- field_name: description
  label: Description
  form_snippet: markdown.html
  form_placeholder: Some useful notes about the data

- field_name: auto_update
  label: Automatic Update
  form_snippet: resource_auto_update.html
  required: true
  validators: ignore_missing

- field_name: auto_update_url
  label: Update URL
  form_placeholder: http://example.com/dataset.json
  display_snippet: link.html
  validators: scheming_auto_update_source ignore_missing url_validator

- field_name: auto_update_last_update
  label: Last Automatic Update
  preset: hidden_value
  display_snippet: datetime_translate.html

- field_name: format
  label: Format
  preset: resource_format_autocomplete

- field_name: encoding
  label: Encoding
  help_text: Specifies the character encoding of the resource's data file. The default is 'UTF-8'. The values should be one of the 'Preferred MIME Names'.
  form_placeholder: 'e.g. UTF-8'

- field_name: rights
  label: Distribution Rights
  form_placeholder: 'e.g. '

- field_name: language
  label: Language
  form_placeholder: 'e.g. English'

- field_name: media
  label: Media Type
  form_placeholder: 'e.g. Files, Compress files, Videos, etc.'

- field_name: publication_date
  label: Publication Date
  form_placeholder: '2025-10-25'
  preset: date

- field_name: spatial
  label: Spatial Information
  section_id: spatial_sec
  single: true
  repeating_subfields:
  - field_name: spatial_hidden
    label: hidden
    preset: hidden_value
  - field_name: location
    label: Location
    single: true
    required: false
    repeating_subfields:
    - field_name: address
      label: Address
      required: false
    - field_name: latitude
      label: Latitude
    - field_name: Longitude
      label: Longitude
  - field_name: extend
    label: Extend
    single: true
    required: false
    repeating_subfields:
    - field_name: extend_name
      label: Name
      required: false
    - field_name: extend_resolution_value
      label: Resolution Value
    - field_name: extend_resolution_unit
      label: Resolution Unit
    - field_name: extend_bounding_box
      label: Bounding Box
    - field_name: extend_crs
      label: CRS

- field_name: temporal
  label: Temporal Information
  section_id: temporal_sec
  single: true
  repeating_subfields:
  - field_name: temporal_hidden
    label: hidden
    preset: hidden_value
  - field_name: temporal_reference_date
    label: Reference Date
  - field_name: temporal_timeseries
    label: Timeseries
    required: false
    repeating_subfields:
      - field_name: temporal_timeseries_start
        label: Start
        form_snippet: scheming/form_snippets/datetime_local.html
        display_snippet: scheming/display_snippets/datetime_local.html
        validators: ignore_missing normalize_datetime
      - field_name: temporal_timeseries_end
        label: End
        form_snippet: scheming/form_snippets/datetime_local.html
        display_snippet: scheming/display_snippets/datetime_local.html
        validators: ignore_missing normalize_datetime
      - field_name: temporal_timeseries_resolution_value
        label: Resolution Value
        form_placeholder: 'e.g. 15'
      - field_name: temporal_timeseries_resolution_unit
        label: Resolution Unit
        form_placeholder: 'e.g. min'
      - field_name: temporal_timeseries_alignment
        label: Alignment
        help_text: 'An indicator of whether timestamps in a time series are to the left, right or in the centre.'
        form_placeholder: 'e.g. left'
      - field_name: temporal_timeseries_aggregation_type
        label: Aggregation Type
        help_text: An indicator of whether the values are a sum, an average or a current value.
        form_placeholder: 'e.g. current'

- field_name: sources
  label: Sources
  section_id: sources_sec
  repeating_subfields:
  - field_name: sources_title
    label: title
    required: false
  - field_name: sources_authors
    label: Authors
    display_snippet: repeating_subfields_authors.html
    repeating_subfields:
      - field_name: sources_author_name
        label: Author Name
        required: false
        validators: ignore_missing
        form_snippet: author.html
      - field_name: sources_author_orcid
        label: ORCID
        form_placeholder: 'ORCID e.g. 0000-0002-1825-0097'
        form_snippet: orcid.html
        validators: ignore_missing
  - field_name: sources_description
    label: Description
  - field_name: sources_publication_year
    label: Publication Year
  - field_name: sources_path
    label: Path
    help_text: A DOI or link to the original source.
  - field_name: sources_licenses
    label: Source Licenses
    repeating_subfields:
      - field_name: sources_licenses_name
        label: Name
        help_text: 'The SPDX identifier.'
        form_placeholder: 'e.g. ODbL-1.0'
      - field_name: sources_licenses_title
        label: Title
        help_text: The official (human-readable) title of the license.
        form_placeholder: 'e.g. Open Data Commons Open Database License 1.0'
      - field_name: sources_licenses_path
        label: Path
        help_text: 'A link or path to the license text.'
        form_placeholder: 'e.g. opendatacommons.org/licenses/odbl/1-0/index.html'
      - field_name: sources_licenses_instruction
        label: Instruction
        help_text: 'A short description of rights and obligations. The use of tldrlegal.com is recommended.'
        form_placeholder: 'You are free to share and change, but you must attribute, and share derivations under the same license. See tldrlegal.com for further information.'
      - field_name: sources_licenses_attribution
        label: Attribution
        help_text: 'A copyright owner of the source. Must be provided if attribution licenses are used.'
        from_placeholder: 'e.g. © Intergovernmental Panel on Climate Change 2023'
      - field_name: sources_licenses_copyright_statement
        label: Copyright Statement
        help_text: 'A link or path that proves that the source or data has the appropriate license. This can be a page number or website imprint.'
        form_placeholder: 'e.g. www.ipcc.ch/copyright'

- field_name: licenses
  label: Licenses
  section_id: licenses_sec
  repeating_subfields:
    - field_name: licenses_name
      label: Name
      help_text: 'The SPDX identifier.'
      form_placeholder: 'e.g. ODbL-1.0'
    - field_name: licenses_title
      label: Title
      help_text: The official (human-readable) title of the license.
      form_placeholder: 'e.g. Open Data Commons Open Database License 1.0'
    - field_name: licenses_path
      label: Path
      help_text: 'A link or path to the license text.'
      form_placeholder: 'e.g. opendatacommons.org/licenses/odbl/1-0/index.html'
    - field_name: licenses_instruction
      label: Instruction
      help_text: 'A short description of rights and obligations. The use of tldrlegal.com is recommended.'
      form_placeholder: 'You are free to share and change, but you must attribute, and share derivations under the same license. See tldrlegal.com for further information.'
    - field_name: licenses_attribution
      label: Attribution
      help_text: 'A copyright owner of the source. Must be provided if attribution licenses are used.'
      form_placeholder: 'e.g. © Intergovernmental Panel on Climate Change 2023'
    - field_name: licenses_copyright_statement
      label: Copyright Statement
      help_text: 'A link or path that proves that the source or data has the appropriate license. This can be a page number or website imprint.'
      form_placeholder: 'e.g. www.ipcc.ch/copyright'

- field_name: contributors
  label: Contributors
  section_id: contributors_sec
  repeating_subfields:
    - field_name: contributors_title
      label: Title
      help_text: 'A full name of the contributor.'
    - field_name: contributors_path
      label: Path
      help_text: 'A qualified link or path pointing to a relevant location online for the contributor. This can be the GitHub page or ORCID.'
    - field_name: contributors_organization
      label: Organization
      help_text: 'A string describing the organization this contributor is affiliated to. This can be relevant for the copyright.'
    - field_name: contributors_roles
      label: Roles
      preset: multiple_text
      help_text: 'An array describing the roles of the contributor. A role is recommended to follow the established vocabulary, i.e. DataCite Metadata Schema contributorRole. Useful roles to indicate are, e.g. DataCollector, ContactPerson, and DataCurator.'
      form_placeholder: 'DataCollector'
    - field_name: contributors_date
      label: Date
      preset: date
      help_text: 'The date of the contribution.'
    - field_name: contributors_object
      label: Object
      help_text: 'The target of the contribution. This can be the data, the metadata or both (data and metadata).'
      form_placeholder: 'e.g. data and metadata'
    - field_name: contributors_comment
      label: Comment
      help_text: 'A free-text commentary on what has been done.'

- field_name: schema
  label: Schema
  section_id: schema_sec
  single: true
  repeating_subfields:
    - field_name: schema_hidden
      label: hidden
      preset: hidden_value
    - field_name: schema_fields
      label: Fields
      help_text: 'An array of objects that describes a field (column) and its detailed information.'
      repeating_subfields:
        - field_name: fields_name
          label: Name
        - field_name: fields_description
          label: Description
        - field_name: fields_type
          label: Type
          help_text: 'The data type of the field. In case of a geom column in a database, also indicate the shape and CRS.'
        - field_name: fields_nullable
          label: Nullable
          preset: select
          choices:
          - value: True
            label: Nullable
          - value: False
            label: Not Nullable
          help_text: 'A boolean key to specify that a column can be nullable. True is the default value.'
          validators: ignore_missing
        - field_name: fields_unit
          label: Unit
          help_text: The unit of a field. If it does not apply, use 'null'. If the unit is given in a separate field, reference this field (e.g. 'unit'). Use a space between numbers and units (100 m).
        - field_name: fields_about
          label: 'is About'
          repeating_subfields:
          - field_name: fields_about_name
            label: Name
            help_text: 'The class label of the ontology term.'
            form_placeholder: 'e.g. wind energy converting unit'
          - field_name: fields_about_id
            label: Ontology Link
            help_text: 'The path of the ontology term (IRI).'
            form_placeholder: 'e.g. https://openenergyplatform.org/ontology/oeo/OEO_00000044'
        - field_name: fields_ref
          label: 'Value Reference'
          repeating_subfields:
          - field_name: fields_ref_value
            label: Value
            help_text: 'The name of the value in the column.'
            form_placeholder: 'e.g. onshore'
          - field_name: fields_ref_name
            label: Name
            help_text: 'The class label of the ontology term in the column.'
            form_placeholder: 'e.g. onshore wind farm'
          - field_name: fields_ref_id
            label: Ontology Link
            help_text: 'The path of the ontology term (IRI) in the column.'
            form_placeholder: 'e.g. https://openenergyplatform.org/ontology/oeo/OEO_00000311'
    - field_name: schema_dialect
      label: Dialect
      help_text: The Dialect defines a simple format for describing the various dialects of CSV files in a language-independent manner. In a database, the values in the fields are 'null'.
      single: true
      repeating_subfields:
      - field_name: dialect_hidden
        label: hidden
        preset: hidden_value
      - field_name: dialect_delimiter
        label: Delimiter
        help_text: The delimiter specifies the character sequence which should separate fields (columns). Common characters are ',' (comma), ';' (semicolon), '.' (point) and '\t' (tab).
        form_placeholder: 'e.g. ,'
      - field_name: dialect_ds
        label: Decimal Separator
        help_text: The symbol used to separate the integer part from the fractional part of a number written in decimal form. Depending on language and region this symbol can be '.' or ','.
        form_placeholder: 'e.g. .'
